version: "3"
services:
    db:
        image: mysql:8
        command: --default-authentication-plugin=mysql_native_password --sql-require-primary-key
        restart: always
        ports:
            - ${MYSQL_PORT}:3306
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    redis:
        image: redis:alpine
        restart: always
        ports:
            - 6379:6379
