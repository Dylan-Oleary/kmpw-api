- name: 'node'
  id: Install Dependencies
  entrypoint: 'yarn'
  args: ['install']

- name: 'node'
  id: Generate Prisma Client
  entrypoint: 'yarn'
  args: ['prisma:generate']

- name: 'node'
  id: Apply Prisma Migrations
  entrypoint: 'yarn'
  secretEnv: ['DATABASE_URL']
  args: ['prisma:migrate']

- name: 'node'
  id: Seed Prisma Database
  entrypoint: 'yarn'
  secretEnv: ['DOG_API_KEY']
  env:
  - 'DOG_API_BASE_URL=https://api.thedogapi.com/v1'
  args: ['prisma:seed']

availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
    env: 'DATABASE_URL'
  - versionName: projects/$PROJECT_ID/secrets/DOG_API_KEY/versions/latest
    env: 'DOG_API_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
