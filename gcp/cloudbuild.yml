- name: 'gcr.io/cloud-builders/gcloud'
  id: Deploy Application
  secretEnv:
  - 'ACCESS_TOKEN_SECRET'
  - 'AWS_ACCESS_KEY_ID'
  - 'AWS_SECRET_KEY'
  - 'CLOUDINARY_API_KEY'
  - 'CLOUDINARY_API_SECRET'
  - 'DATABASE_URL'
  - 'DOG_API_KEY'
  - 'REDIS_HOST'
  - 'REFRESH_TOKEN_SECRET'
  - 'SENTRY_DSN'
  - 'WEATHER_API_KEY'
  args:
  - 'run'
  - 'deploy'
  - 'woxy-api'
  - '--allow-unauthenticated'
  - '--image=us-east1-docker.pkg.dev/$PROJECT_ID/woxy-api/api:d469285'
  - '--max-instances=3'
  - '--min-instances=1'
  - '--platform=managed'
  - '--region=us-east1'
  - '--tag=prod'
  - '--timeout=30s'
  # Env Config
  - "--set-env-vars=NODE_ENV=production"
  - "--set-env-vars=ACCESS_TOKEN_LIFESPAN=1d"
  - "--set-env-vars=AWS_REKOGNITION=1"
  - "--set-env-vars=AWS_REKOGNITION_REGION=us-east-1"
  - "--set-env-vars=CLOUDINARY_CLOUD_NAME=dhgpgb0yw"
  - "--set-env-vars=CLOUDINARY_FOLDER_PREFIX=kmpw"
  - "--set-env-vars=DOG_API_BASE_URL=https://api.thedogapi.com/v1"
  - "--set-env-vars=REFRESH_TOKEN_LIFESPAN=7d"
  - "--set-env-vars=SENTRY_ENABLED=1"
  - "--set-env-vars=SENTRY_SAMPLE_RATE=0.75"
  - "--set-env-vars=USER_MAX_NUM_OF_DOGS=5"
  - "--set-env-vars=WEATHER_API_BASE_URL=http://api.weatherapi.com/v1"
  - "--set-env-vars=WEATHER_API_MODERATE_ALERT_CODES="
  - "--set-env-vars=^##^WEATHER_API_SEVERE_ALERT_CODES=1063,1066,1069,1072,1087,1114,1117,1168,1171,1195,1201,1207,1219,1222,1225,1237,1246,1252,1258,1261,1264,1273,1276,1279,1282"
  - "--set-env-vars=WEATHER_CACHE_DISTANCE_METRES=5000"
  - "--set-env-vars=WEATHER_CACHE_LIFESPAN=5m"
  # Env Secrets
  - "--set-env-vars=ACCESS_TOKEN_SECRET=$$ACCESS_TOKEN_SECRET"
  - "--set-env-vars=AWS_ACCESS_KEY_ID=$$AWS_ACCESS_KEY_ID"
  - "--set-env-vars=AWS_SECRET_KEY=$$AWS_SECRET_KEY"
  - "--set-env-vars=CLOUDINARY_API_KEY=$$CLOUDINARY_API_KEY"
  - "--set-env-vars=CLOUDINARY_API_SECRET=$$CLOUDINARY_API_SECRET"
  - "--set-env-vars=DATABASE_URL=$$DATABASE_URL"
  - "--set-env-vars=DOG_API_KEY=$$DOG_API_KEY"
  - "--set-env-vars=REDIS_HOST=$$REDIS_HOST"
  - "--set-env-vars=REFRESH_TOKEN_SECRET=$$REFRESH_TOKEN_SECRET"
  - "--set-env-vars=SENTRY_DSN=$$SENTRY_DSN"
  - "--set-env-vars=WEATHER_API_KEY=$$WEATHER_API_KEY"


availableSecrets:
  secretManager:
  - versionName: projects/$PROJECT_ID/secrets/ACCESS_TOKEN_SECRET/versions/latest
    env: 'ACCESS_TOKEN_SECRET'
  - versionName: projects/$PROJECT_ID/secrets/AWS_ACCESS_KEY_ID/versions/latest
    env: 'AWS_ACCESS_KEY_ID'
  - versionName: projects/$PROJECT_ID/secrets/AWS_SECRET_KEY/versions/latest
    env: 'AWS_SECRET_KEY'
  - versionName: projects/$PROJECT_ID/secrets/CLOUDINARY_API_KEY/versions/latest
    env: 'CLOUDINARY_API_KEY'
  - versionName: projects/$PROJECT_ID/secrets/CLOUDINARY_API_SECRET/versions/latest
    env: 'CLOUDINARY_API_SECRET'
  - versionName: projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest
    env: 'DATABASE_URL'
  - versionName: projects/$PROJECT_ID/secrets/DOG_API_KEY/versions/latest
    env: 'DOG_API_KEY'
  - versionName: projects/$PROJECT_ID/secrets/REDIS_HOST/versions/latest
    env: 'REDIS_HOST'
  - versionName: projects/$PROJECT_ID/secrets/REFRESH_TOKEN_SECRET/versions/latest
    env: 'REFRESH_TOKEN_SECRET'
  - versionName: projects/$PROJECT_ID/secrets/SENTRY_DSN/versions/latest
    env: 'SENTRY_DSN'
  - versionName: projects/$PROJECT_ID/secrets/WEATHER_API_KEY/versions/latest
    env: 'WEATHER_API_KEY'

options:
  logging: CLOUD_LOGGING_ONLY
