- name: 'gcr.io/cloud-builders/gcloud'
  id: Deploy Application
  args:
  - 'run'
  - 'deploy'
  - 'woxy-api'
  - '--allow-unauthenticated'
  - '--image=us-east1-docker.pkg.dev/$PROJECT_ID/woxy-api/api:d469285'
  - '--max-instances=3'
  - '--min-instances=1'
  - '--platform=managed'
  - '--region=us-east1'
  - '--tag=prod'
  - '--timeout=30s'
  # Env Config
  - '--set-env-vars=NODE_ENV=production'
  - '--set-env-vars=ACCESS_TOKEN_LIFESPAN=1d'
  - '--set-env-vars=AWS_REKOGNITION=1'
  - '--set-env-vars=AWS_REKOGNITION_REGION=us-east-1'
  - '--set-env-vars=CLOUDINARY_CLOUD_NAME=dhgpgb0yw'
  - '--set-env-vars=CLOUDINARY_FOLDER_PREFIX=kmpw'
  - '--set-env-vars=DOG_API_BASE_URL=https://api.thedogapi.com/v1'
  - '--set-env-vars=REFRESH_TOKEN_LIFESPAN=7d'
  - '--set-env-vars=SENTRY_ENABLED=1'
  - '--set-env-vars=SENTRY_SAMPLE_RATE=0.75'
  - '--set-env-vars=USER_MAX_NUM_OF_DOGS=5'
  - '--set-env-vars=WEATHER_API_BASE_URL=http://api.weatherapi.com/v1'
  - '--set-env-vars=WEATHER_API_MODERATE_ALERT_CODES='
  - '--set-env-vars=^##^WEATHER_API_SEVERE_ALERT_CODES=1063,1066,1069,1072,1087,1114,1117,1168,1171,1195,1201,1207,1219,1222,1225,1237,1246,1252,1258,1261,1264,1273,1276,1279,1282'
  - '--set-env-vars=WEATHER_CACHE_DISTANCE_METRES=5000'
  - '--set-env-vars=WEATHER_CACHE_LIFESPAN=5m'
  # Env Secrets
  - '--set-secrets=ACCESS_TOKEN_SECRET=projects/$PROJECT_ID/secrets/ACCESS_TOKEN_SECRET/versions/latest'
  - '--set-secrets=AWS_ACCESS_KEY_ID=projects/$PROJECT_ID/secrets/AWS_ACCESS_KEY_ID/versions/latest'
  - '--set-secrets=AWS_SECRET_KEY=projects/$PROJECT_ID/secrets/AWS_SECRET_KEY/versions/latest'
  - '--set-secrets=CLOUDINARY_API_KEY=projects/$PROJECT_ID/secrets/CLOUDINARY_API_KEY/versions/latest'
  - '--set-secrets=CLOUDINARY_API_SECRET=projects/$PROJECT_ID/secrets/CLOUDINARY_API_SECRET/versions/latest'
  - '--set-secrets=DATABASE_URL=projects/$PROJECT_ID/secrets/DATABASE_URL/versions/latest'
  - '--set-secrets=DOG_API_KEY=projects/$PROJECT_ID/secrets/DOG_API_KEY/versions/latest'
  - '--set-secrets=REDIS_HOST=projects/$PROJECT_ID/secrets/REDIS_HOST/versions/latest'
  - '--set-secrets=REFRESH_TOKEN_SECRET=projects/$PROJECT_ID/secrets/REFRESH_TOKEN_SECRET/versions/latest'
  - '--set-secrets=SENTRY_DSN=projects/$PROJECT_ID/secrets/SENTRY_DSN/versions/latest'
  - '--set-secrets=WEATHER_API_KEY=$projects/$PROJECT_ID/secrets/WEATHER_API_KEY/versions/latest'


